name: CD - Pruebas, imagen Docker y despliegue en EC2

# Solo cambios incorporados a main despliegan. Un pull_request NO ejecuta este workflow.
on:
  push:
    branches: [main]

# Evita dos despliegues al mismo tiempo
concurrency:
  group: cd-produccion
  cancel-in-progress: false

env:
  # Repositorio de la imagen en Docker Hub (usuario/repositorio)
  IMAGE_NAME: will4929/api-libros

jobs:
  # 1) Pruebas
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  # 2) Construir y publicar la imagen identificada con el SHA del commit
  build-and-push:
    name: Construir y publicar imagen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # 3) Desplegar esa misma imagen en EC2
  deploy:
    name: Desplegar en EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # El SSH de EC2 solo acepta mi IP; se abre el puerto 22 para la IP de este
      # runner solo durante el despliegue y se cierra al final (paso "always").
      - name: Permitir temporalmente la IP del runner en el puerto 22
        id: ip
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=github-actions-temporal}]"

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar imagen ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "IMAGE='${{ env.IMAGE_NAME }}:${{ github.sha }}' bash -s" < scripts/deploy.sh

      - name: Verificar desde Internet (/health y /libros)
        run: |
          curl -fsS "http://${{ secrets.EC2_HOST }}/health" | tee health.json
          echo
          grep -q '${{ github.sha }}' health.json
          curl -fsS "http://${{ secrets.EC2_HOST }}/libros"

      - name: Cerrar el puerto 22 para el runner
        if: always() && steps.ip.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.runner_ip }}/32}]"
          rm -f ~/.ssh/ec2.pem
